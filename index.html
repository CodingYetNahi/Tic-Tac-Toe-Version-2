<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe — Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            overflow-x: hidden;
            padding: 10px;
        }

        /* Animated background orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: 0;
            animation: float 8s ease-in-out infinite alternate;
        }
        body::before {
            width: clamp(250px, 40vw, 500px);
            height: clamp(250px, 40vw, 500px);
            background: #e74c3c;
            top: -150px; left: -100px;
        }
        body::after {
            width: clamp(200px, 35vw, 400px);
            height: clamp(200px, 35vw, 400px);
            background: #3498db;
            bottom: -100px; right: -80px;
            animation-delay: 2s;
        }
        @keyframes float {
            to { transform: translate(40px, 30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 10px;
            width: 100%;
            max-width: 420px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #e74c3c, #9b59b6, #3498db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sound-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background 0.3s;
        }

        /* Glass Card */
        .glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: clamp(12px, 4vw, 20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
        }

        /* Controls Row */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .toggle-group {
            display: flex;
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            width: 100%;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px 12px;
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .toggle-btn.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.05);
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 15px;
            justify-content: space-around;
            align-items: center;
            width: 100%;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: clamp(0.65rem, 2vw, 0.75rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }

        .score-value {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
        }

        .score-x { color: #e74c3c; }
        .score-o { color: #3498db; }
        .score-ties { color: #95a5a6; }

        /* Responsive Board Container */
        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 320px;
            margin: 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            height: 100%;
        }

        .cell {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: clamp(10px, 3vw, 16px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 8vw, 2.8rem);
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .cell.x {
            color: #e74c3c;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.6);
        }

        .cell.o {
            color: #3498db;
            text-shadow: 0 0 20px rgba(52, 152, 219, 0.6);
        }

        .cell.winning {
            background: rgba(255, 255, 255, 0.2);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            to { transform: scale(1.03); }
        }

        /* Overlay & Modal */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 12, 41, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-text {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .reset-btn {
            padding: 12px 28px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(90deg, #e74c3c, #9b59b6, #3498db);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }

        footer {
            margin-top: 5px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-row">
            <h1>TIC TAC TOE</h1>
            <button class="sound-btn" id="sound-btn" title="Toggle Sound">🔊</button>
        </div>

        <div class="controls glass">
            <div class="toggle-group" id="mode-toggle">
                <button class="toggle-btn active" data-mode="pvp">2 Players</button>
                <button class="toggle-btn" data-mode="ai">Vs AI</button>
            </div>
            <div class="toggle-group" id="diff-toggle" style="display: none; margin-top: 8px;">
                <button class="toggle-btn active" data-diff="easy">Easy</button>
                <button class="toggle-btn" data-diff="unbeatable">Unbeatable</button>
            </div>
        </div>

        <div class="scoreboard glass">
            <div class="score-item">
                <div class="score-label" id="label-x">Player X</div>
                <div class="score-value score-x" id="score-x">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Ties</div>
                <div class="score-value score-ties" id="score-ties">0</div>
            </div>
            <div class="score-item">
                <div class="score-label" id="label-o">Player O</div>
                <div class="score-value score-o" id="score-o">0</div>
            </div>
        </div>

        <div class="glass board-wrapper">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="overlay" id="overlay">
                <div class="winner-text" id="winner-text">X Wins!</div>
                <button class="reset-btn" id="restart-btn">Play Again</button>
            </div>
        </div>

        <footer>
            &copy; Dhamarikar Group 2026
        </footer>
    </div>

    <script>
        // Audio Engine using Web Audio API
        let audioCtx = null;
        let soundMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSound() {
            if (soundMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if (soundMuted) return;
            initAudio();
            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.08);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.08);
                osc.stop(audioCtx.currentTime + i * 0.08 + 0.2);
            });
        }

        // AI Victory "Faaah" Sound Effect Synthesizer
        function playFaaahSound() {
            if (soundMuted) return;
            initAudio();

            // Low frequency buzz/tone drop
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.8);

            // Breath/Exhale Noise simulation
            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(400, audioCtx.currentTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.8);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            osc.start();
            noise.start();
            osc.stop(audioCtx.currentTime + 0.8);
            noise.stop(audioCtx.currentTime + 0.8);
        }

        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        let boardState = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp'; 
        let difficulty = 'easy'; 
        let scores = { X: 0, O: 0, ties: 0 };

        // DOM Elements
        const cells = document.querySelectorAll('.cell');
        const overlay = document.getElementById('overlay');
        const winnerText = document.getElementById('winner-text');
        const restartBtn = document.getElementById('restart-btn');
        const modeButtons = document.querySelectorAll('#mode-toggle .toggle-btn');
        const diffToggle = document.getElementById('diff-toggle');
        const diffButtons = document.querySelectorAll('#diff-toggle .toggle-btn');
        const labelO = document.getElementById('label-o');
        const soundBtn = document.getElementById('sound-btn');

        // Mute / Unmute Toggle
        soundBtn.addEventListener('click', () => {
            soundMuted = !soundMuted;
            soundBtn.textContent = soundMuted ? '🔇' : '🔊';
        });

        // Event Listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', resetBoard);

        modeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameMode = e.target.dataset.mode;
                diffToggle.style.display = gameMode === 'ai' ? 'flex' : 'none';
                labelO.textContent = gameMode === 'ai' ? 'AI (O)' : 'Player O';
                resetGame();
            });
        });

        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                playClickSound();
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = e.target.dataset.diff;
                resetGame();
            });
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;
            if (boardState[index] !== null || !gameActive) return;

            playClickSound();
            makeMove(index, currentPlayer);

            if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
                setTimeout(makeAIMove, 300);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());

            const winCombo = checkWin(boardState, player);
            if (winCombo) {
                endGame(false, winCombo);
            } else if (boardState.every(cell => cell !== null)) {
                endGame(true);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function makeAIMove() {
            let move;
            if (difficulty === 'easy') {
                const emptyIndices = boardState
                    .map((val, idx) => val === null ? idx : null)
                    .filter(val => val !== null);
                move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                move = minimax(boardState, 'O').index;
            }

            if (move !== undefined) {
                playClickSound();
                makeMove(move, 'O');
            }
        }

        // Minimax Algorithm
        function minimax(newBoard, player) {
            const availSpots = newBoard
                .map((val, idx) => val === null ? idx : null)
                .filter(val => val !== null);

            if (checkWin(newBoard, 'X')) return { score: -10 };
            if (checkWin(newBoard, 'O')) return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            const moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === 'O') {
                    const result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = null;
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }

            return moves[bestMove];
        }

        function checkWin(board, player) {
            return WINNING_COMBOS.find(combo => {
                return combo.every(index => board[index] === player);
            });
        }

        function endGame(draw, winCombo = null) {
            gameActive = false;
            if (draw) {
                scores.ties++;
                document.getElementById('score-ties').textContent = scores.ties;
                winnerText.textContent = "It's a Draw!";
            } else {
                scores[currentPlayer]++;
                document.getElementById(`score-${currentPlayer.toLowerCase()}`).textContent = scores[currentPlayer];
                winCombo.forEach(idx => cells[idx].classList.add('winning'));
                
                if (gameMode === 'ai' && currentPlayer === 'O') {
                    winnerText.textContent = 'AI Wins!';
                    playFaaahSound(); // Play synthesized "Faaah" sound when AI wins
                } else {
                    winnerText.textContent = `Player ${currentPlayer} Wins!`;
                    playWinSound();
                }
            }
            overlay.classList.add('active');
        }

        function resetBoard() {
            playClickSound();
            boardState = Array(9).fill(null);
            currentPlayer = 'X';
            gameActive = true;
            overlay.classList.remove('active');

            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
        }

        function resetGame() {
            scores = { X: 0, O: 0, ties: 0 };
            document.getElementById('score-x').textContent = '0';
            document.getElementById('score-o').textContent = '0';
            document.getElementById('score-ties').textContent = '0';
            resetBoard();
        }
    </script>
</body>
</html>
