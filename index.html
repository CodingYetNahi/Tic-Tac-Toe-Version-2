<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e2638 0%, #0d1118 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(255, 255, 255, 0.03);
            --accent-x: #ff453a;
            --accent-o: #0a84ff;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.48);
            --segmented-bg: rgba(118, 118, 128, 0.24);
            --segmented-active: rgba(255, 255, 255, 0.2);
            --radius-xl: 24px;
            --radius-l: 16px;
            --radius-m: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000000;
            background-image: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(10, 132, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .sound-toggle {
            background: var(--segmented-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .sound-toggle:active {
            transform: scale(0.92);
        }

        /* Glass Container Cards */
        .card {
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Apple iOS Segmented Control */
        .segmented-control {
            background: var(--segmented-bg);
            border-radius: var(--radius-m);
            padding: 2px;
            display: flex;
            gap: 2px;
            position: relative;
        }

        .segmented-control + .segmented-control {
            margin-top: 10px;
        }

        .segment-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        .segment-btn.active {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Scoreboard */
        .scoreboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            padding: 14px 12px;
        }

        .score-col {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .score-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .score-num {
            font-size: 1.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .score-num.x { color: var(--accent-x); }
        .score-num.o { color: var(--accent-o); }
        .score-num.ties { color: var(--text-primary); }

        /* Board Container Alignment Fix */
        .board-card {
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .cell {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-l);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .cell:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.08);
        }

        .cell.x {
            color: var(--accent-x);
            text-shadow: 0 0 16px rgba(255, 69, 58, 0.4);
        }

        .cell.o {
            color: var(--accent-o);
            text-shadow: 0 0 16px rgba(10, 132, 255, 0.4);
        }

        .cell.winning {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Overlay Modal */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 17, 24, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .status-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .action-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 28px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 99px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.25);
        }

        .action-btn:active {
            transform: scale(0.94);
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="title">Tic Tac Toe</div>
            <button class="sound-toggle" id="sound-toggle" aria-label="Toggle Sound">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
            </button>
        </div>

        <!-- Mode Selectors -->
        <div class="card">
            <div class="segmented-control" id="mode-toggle">
                <button class="segment-btn active" data-mode="pvp">2 Players</button>
                <button class="segment-btn" data-mode="ai">Vs AI</button>
            </div>
            <div class="segmented-control" id="diff-toggle" style="display: none;">
                <button class="segment-btn active" data-diff="easy">Easy</button>
                <button class="segment-btn" data-diff="unbeatable">Unbeatable</button>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="card scoreboard">
            <div class="score-col">
                <span class="score-label" id="label-x">Player X</span>
                <span class="score-num x" id="score-x">0</span>
            </div>
            <div class="score-col">
                <span class="score-label">Ties</span>
                <span class="score-num ties" id="score-ties">0</span>
            </div>
            <div class="score-col">
                <span class="score-label" id="label-o">Player O</span>
                <span class="score-num o" id="score-o">0</span>
            </div>
        </div>

        <!-- Game Board -->
        <div class="card board-card">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- Result Overlay -->
            <div class="overlay" id="overlay">
                <div class="status-title" id="winner-text">Player X Wins</div>
                <button class="action-btn" id="restart-btn">Play Again</button>
            </div>
        </div>

        <footer>
            &copy; Dhamarikar Group 2026
        </footer>
    </div>

    <script>
        // Web Audio Synthesizer
        let audioCtx = null;
        let soundMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playClickSound() {
            if (soundMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playWinSound() {
            if (soundMuted) return;
            initAudio();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.07);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.07 + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.07);
                osc.stop(audioCtx.currentTime + i * 0.07 + 0.15);
            });
        }

        function playFaaahSound() {
            if (soundMuted) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + 0.7);

            const bufferSize = audioCtx.sampleRate * 0.7;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(350, audioCtx.currentTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.7);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

            gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            osc.start();
            noise.start();
            osc.stop(audioCtx.currentTime + 0.7);
            noise.stop(audioCtx.currentTime + 0.7);
        }

        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        let boardState = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp'; 
        let difficulty = 'easy'; 
        let scores = { X: 0, O: 0, ties: 0 };

        // DOM
        const cells = document.querySelectorAll('.cell');
        const overlay = document.getElementById('overlay');
        const winnerText = document.getElementById('winner-text');
        const restartBtn = document.getElementById('restart-btn');
        const modeButtons = document.querySelectorAll('#mode-toggle .segment-btn');
        const diffToggle = document.getElementById('diff-toggle');
        const diffButtons = document.querySelectorAll('#diff-toggle .segment-btn');
        const labelO = document.getElementById('label-o');
        const soundToggle = document.getElementById('sound-toggle');

        soundToggle.addEventListener('click', () => {
            soundMuted = !soundMuted;
            soundToggle.style.opacity = soundMuted ? '0.4' : '1';
        });

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        restartBtn.addEventListener('click', resetBoard);

        modeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                playClickSound();
                modeButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                gameMode = e.target.dataset.mode;
                diffToggle.style.display = gameMode === 'ai' ? 'flex' : 'none';
                labelO.textContent = gameMode === 'ai' ? 'AI (O)' : 'Player O';
                resetGame();
            });
        });

        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                playClickSound();
                diffButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                difficulty = e.target.dataset.diff;
                resetGame();
            });
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;
            if (boardState[index] !== null || !gameActive) return;

            playClickSound();
            makeMove(index, currentPlayer);

            if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
                setTimeout(makeAIMove, 300);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());

            const winCombo = checkWin(boardState, player);
            if (winCombo) {
                endGame(false, winCombo);
            } else if (boardState.every(cell => cell !== null)) {
                endGame(true);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        }

        function makeAIMove() {
            let move;
            if (difficulty === 'easy') {
                const emptyIndices = boardState
                    .map((val, idx) => val === null ? idx : null)
                    .filter(val => val !== null);
                move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            } else {
                move = minimax(boardState, 'O').index;
            }

            if (move !== undefined) {
                playClickSound();
                makeMove(move, 'O');
            }
        }

        function minimax(newBoard, player) {
            const availSpots = newBoard
                .map((val, idx) => val === null ? idx : null)
                .filter(val => val !== null);

            if (checkWin(newBoard, 'X')) return { score: -10 };
            if (checkWin(newBoard, 'O')) return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            const moves = [];
            for (let i = 0; i < availSpots.length; i++) {
                const move = {};
                move.index = availSpots[i];
                newBoard[availSpots[i]] = player;

                if (player === 'O') {
                    const result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[availSpots[i]] = null;
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            } else {
                let bestScore = 10000;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = i;
                    }
                }
            }

            return moves[bestMove];
        }

        function checkWin(board, player) {
            return WINNING_COMBOS.find(combo => {
                return combo.every(index => board[index] === player);
            });
        }

        function endGame(draw, winCombo = null) {
            gameActive = false;
            if (draw) {
                scores.ties++;
                document.getElementById('score-ties').textContent = scores.ties;
                winnerText.textContent = "It's a Draw";
            } else {
                scores[currentPlayer]++;
                document.getElementById(`score-${currentPlayer.toLowerCase()}`).textContent = scores[currentPlayer];
                winCombo.forEach(idx => cells[idx].classList.add('winning'));
                
                if (gameMode === 'ai' && currentPlayer === 'O') {
                    winnerText.textContent = 'AI Wins';
                    playFaaahSound();
                } else {
                    winnerText.textContent = `Player ${currentPlayer} Wins`;
                    playWinSound();
                }
            }
            overlay.classList.add('active');
        }

        function resetBoard() {
            playClickSound();
            boardState = Array(9).fill(null);
            currentPlayer = 'X';
            gameActive = true;
            overlay.classList.remove('active');

            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
            });
        }

        function resetGame() {
            scores = { X: 0, O: 0, ties: 0 };
            document.getElementById('score-x').textContent = '0';
            document.getElementById('score-o').textContent = '0';
            document.getElementById('score-ties').textContent = '0';
            resetBoard();
        }
    </script>
</body>
</html>
